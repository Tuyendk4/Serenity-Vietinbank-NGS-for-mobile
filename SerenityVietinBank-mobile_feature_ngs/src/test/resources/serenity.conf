serenity.take.screenshots=BEFORE_AND_AFTER_EACH_STEP
serenity.maintain.session = true
environments {
  dev {
    platformName = "iOS"
    platformVersion = "15.7.9"
    deviceName = "iPhone 6s"
    udid = "9cfa855ce544d9ff436f80f308002d221801266c"
    android {
      appPackage = "com.vietinbank.ipay"
      appActivity = "com.vnpaystart.SplashActivity"
    }
    ios {
      bundleId = "com.vietinbank.mobilebanking"
    }
    appium_server = menual
  }
  iphoneX {
      platformName = "iOS"
      platformVersion = "16.7.7"
      deviceName = "iPhone X"
      udid = "d7ad0223e16d29a3587a96cf0cc45e4cbd9b9994"
      ios {
        bundleId = "com.vietinbank.mobilebanking"
      }
      appium_server = auto
  #    appium_server = manual
  }
  redmiNote9 {
      platformName = "Android"
      platformVersion = "12"
      deviceName = "Redmi Note 9"
      udid = "80eabbae"
      android {
         appPackage = "com.vietinbank.ipay"
         appActivity = "com.vnpaystart.SplashActivity"
      }
      appium_server = auto
  }
}
serenity.reports.show.step.details = true
